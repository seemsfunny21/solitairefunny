<script id="game-dialog-controller">
(function(){
 'use strict';
 let current=null;
 function mount(){
  let el=document.getElementById('gameDialogCover');
  if(el)return el;
  el=document.createElement('div');el.id='gameDialogCover';el.className='game-dialog-cover';el.hidden=true;
  el.setAttribute('role','presentation');
  const root=document.querySelector('main.app')||document.querySelector('.app-shell')&&document.body||document.body;
  root.appendChild(el);
  return el;
 }
 function open(title,message,choices,opts){
  if(current)return Promise.resolve(null);
  const layer=mount();layer.replaceChildren();layer.hidden=false;
  const box=document.createElement('section');box.className='game-dialog-box';
  box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');box.setAttribute('aria-label',title);
  const heading=document.createElement('h2');heading.textContent=title;box.appendChild(heading);
  const paragraph=document.createElement('p');paragraph.textContent=message;box.appendChild(paragraph);
  const zone=document.createElement('div');zone.className=opts&&opts.grid?'game-dialog-choices':'game-dialog-actions';
  box.appendChild(zone);layer.appendChild(box);
  let resolvePromise;
  const promise=new Promise(resolve=>{resolvePromise=resolve;});
  const close=value=>{
   if(!current)return;
   document.removeEventListener('keydown',keyHandler,true);layer.hidden=true;layer.replaceChildren();
   current=null;resolvePromise(value);
  };
  const keyHandler=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();close(null);}};
  current={close};document.addEventListener('keydown',keyHandler,true);
  if(opts&&opts.input){
   const input=document.createElement('input');input.className='game-dialog-copy';input.readOnly=true;input.value=opts.input;input.setAttribute('aria-label','Σύνδεσμος πρόσκλησης');box.insertBefore(input,zone);
   input.addEventListener('focus',()=>input.select());
  }
  for(const option of choices){
   const button=document.createElement('button');button.type='button';
   button.className=opts&&opts.grid?'':'game-dialog-btn'+(option.primary?' primary':'');
   button.textContent=option.label;button.addEventListener('click',()=>close(option.value));
   zone.appendChild(button);
  }
  const first=zone.querySelector('button');if(first)first.focus();
  return promise;
 }
 const confirm=message=>open('Επιβεβαίωση',message,[{label:'Ακύρωση',value:false},{label:'Συνέχεια',value:true,primary:true}]).then(x=>x===true);
 const wish=()=>open('🀄 Ευχή Mahjong','Ποιο φύλλο ζητάς από τους επόμενους παίκτες;',[...Array(13)].map((_,i)=>{const n=i+2;return{label:n===11?'J':n===12?'Q':n===13?'K':n===14?'A':String(n),value:n};}).concat([{label:'Ακύρωση',value:null}]),{grid:true});
 const copy=url=>open('🔗 Πρόσκληση φίλου','Αντέγραψε τον σύνδεσμο και στείλε τον φίλο σου.',[{label:'Κλείσιμο',value:true,primary:true}],{input:url});
 window.GameDialog=Object.freeze({confirm,wish,copy});
})();
</script>

<div class="suits" aria-hidden="true"><span class="red">♥ ♦</span><span>♣ ♠</span></div>
<h2>Τράβηγμα φύλλων</h2>
<div class="mode-buttons"><button type="button" data-draw="1" aria-pressed="true">1 φύλλο</button><button type="button" data-draw="3" aria-pressed="false">3 φύλλα</button></div>
<button id="newSide" class="side-new-game" type="button">↻ Νέα παρτίδα</button>
<div class="info">Η επιλογή αποθηκεύεται μαζί με την παρτίδα.</div>
</aside></div>

</section></main>
<script>
(function(){
'use strict';
const S=['♥','♦','♣','♠'],KEY='solitairefunny:v1',STATS='solitairefunny:stats',$=id=>document.getElementById(id);
const clone=x=>JSON.parse(JSON.stringify(x)),color=c=>c.s<2?0:1,lab=c=>(c.v===1?'A':c.v===11?'J':c.v===12?'Q':c.v===13?'K':String(c.v))+S[c.s];
const DRAW_SETTING='solitairefunny:nextDrawCount';
let drawMode=1;
try{drawMode=Number(localStorage.getItem(DRAW_SETTING))===3?3:1;}catch(_){}
let state,undo=[],pick=null,lastCardTap=null,elapsed=0,since=0,active=true,stats={wins:0,best:null};
try{stats=JSON.parse(localStorage.getItem(STATS)||'null')||stats;}catch(_){}
function format(ms){let n=Math.floor(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function now(){return elapsed+(since&&active&&!state.done?Date.now()-since:0)}
function pause(){if(since){elapsed+=Date.now()-since;since=0;}save()}
function resume(){if(active&&state&&!state.done&&!since)since=Date.now()}
function save(){try{localStorage.setItem(KEY,JSON.stringify({state,elapsed:now()}))}catch(_){}}
function say(v){$('msg').textContent=v}
function snapshot(){undo.push({state:clone(state),elapsed:now()});if(undo.length>120)undo.shift()}
function cardKey(c){return c.s+':'+c.v}
function blockedFromAuto(c){return (state.manualFoundationCards||[]).includes(cardKey(c))}
function autoToFoundation(){
 // Only exposed top cards in the tableau or waste are eligible.
 // Respect cards the player deliberately retrieved from a foundation.
 if(state.done)return 0;
 let count=0;
 for(let tries=0;tries<52;tries++){
   let found=false;
   for(const zone of ['w','t']){
     for(let col=0;col<(zone==='w'?1:7);col++){
       const pile=zone==='w'?state.waste:state.t[col],index=pile.length-1,c=pile[index];
       if(!c||!c.up||blockedFromAuto(c))continue;
       if(!validMove({zone,col,index},'f',c.s))continue;
       pile.pop();
       state.f[c.s].push(c);
       if(zone==='t'&&pile.length)pile[pile.length-1].up=true;
       state.moves++;count++;found=true;
       break;
     }
     if(found)break;
   }
   if(!found)break;
 }
 return count;
}
function finishAction(){
 pick=null;lastCardTap=null;
 autoToFoundation();
 winIfComplete();draw();save();
}
function newGame(){
const cards=Array.from({length:52},(_,i)=>({s:Math.floor(i/13),v:i%13+1,up:false}));
for(let i=51;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}
state={t:Array.from({length:7},()=>[]),f:[[],[],[],[]],stock:[],waste:[],moves:0,done:false,drawCount:drawMode,manualFoundationCards:[]};
for(let col=0;col<7;col++)for(let row=0;row<=col;row++){const c=cards.pop();c.up=row===col;state.t[col].push(c);}
state.stock=cards;undo=[];elapsed=0;since=0;pick=null;lastCardTap=null;say('Νέα παρτίδα! Τα διαθέσιμα φύλλα ανεβαίνουν αυτόματα στις βάσεις.');resume();finishAction();
}
function source(p){return p.zone==='t'?state.t[p.col]:p.zone==='w'?state.waste:state.f[p.col]}
function pickedCards(p){return source(p).slice(p.index)}
function validSequence(arr){return arr.every((c,i)=>c.up&&(i===0||(arr[i-1].v===c.v+1&&color(arr[i-1])!==color(c))))}
function validMove(p,dest,col){const arr=pickedCards(p);if(!arr.length||!validSequence(arr))return false;if(p.zone===dest&&p.col===col)return false;
if(dest==='t'){const a=state.t[col],last=a[a.length-1];return !last?arr[0].v===13: last.up&&last.v===arr[0].v+1&&color(last)!==color(arr[0]);}
if(dest==='f'){return arr.length===1&&arr[0].s===col&&arr[0].v===(state.f[col].length+1)}
return false;}
function winIfComplete(){if(!state.done&&state.f.every(a=>a.length===13)){state.done=true;pause();stats.wins=(stats.wins||0)+1;stats.best=stats.best==null?elapsed:Math.min(stats.best,elapsed);try{localStorage.setItem(STATS,JSON.stringify(stats))}catch(_){}say('🏆 Συγχαρητήρια! Ολοκλήρωσες την πασιέντζα.');}}
function move(p,dest,col){if(!validMove(p,dest,col))return false;
 snapshot();
 const src=source(p),taking=src.splice(p.index),target=dest==='t'?state.t[col]:state.f[col];
 target.push(...taking);
 if(p.zone==='t'&&src.length)src[src.length-1].up=true;
 if(p.zone==='f'&&dest==='t'){
   // Do not immediately return a card that the player pulled down manually.
   for(const c of taking)if(!blockedFromAuto(c))state.manualFoundationCards.push(cardKey(c));
 }else{
   // After a subsequent deliberate move, allow automatic foundation moves again.
   for(const c of taking)state.manualFoundationCards=state.manualFoundationCards.filter(key=>key!==cardKey(c));
 }
 state.moves++;finishAction();return true;}
function choose(zone,col,index){const p={zone,col,index};const c=source(p)[index];if(!c||!c.up)return;pick=p;say('Επιλέχθηκε '+lab(c)+'. Διάλεξε προορισμό.');draw();}
function select(zone,col,index){if(state.done)return;
if(pick&&(['t','f'].includes(zone))&&move(pick,zone,col))return;
if(zone==='w'){if(state.waste.length)choose('w',0,state.waste.length-1);return;}
if(zone==='f'){if(state.f[col].length)choose('f',col,state.f[col].length-1);return;}
if(zone==='t'&&state.t[col].length){const i=index??state.t[col].length-1;if(state.t[col][i].up)choose('t',col,i);return;}
pick=null;draw();}
function toFoundation(zone,col,index){
 const p={zone,col,index},cards=pickedCards(p);
 if(cards.length!==1)return false;
 // A player's explicit double tap overrides manual auto-hold.
 return move(p,'f',cards[0].s);
}
function tapCard(zone,col,index){
 if(state.done)return;
 const pile=zone==='w'?state.waste:state.t[col],c=pile[index];
 if(!c||!c.up)return;
 const timestamp=Date.now(),identity=cardKey(c),previous=lastCardTap;
 if(previous&&previous.identity===identity&&timestamp-previous.time<=460){
   lastCardTap=null;
   if(toFoundation(zone,col,index))return;
 }
 lastCardTap={identity,time:timestamp};
 select(zone,col,index);
}
function drawStock(){if(state.done||!state.stock.length&&!state.waste.length)return;snapshot();
if(state.stock.length){
 const count=state.drawCount===3?3:1;
 for(let i=0;i<count&&state.stock.length;i++){
  const c=state.stock.pop();c.up=true;state.waste.push(c);
 }
}else {state.stock=state.waste.reverse().map(c=>({...c,up:false}));state.waste=[];}
state.moves++;finishAction();}
function suitClass(c){return color(c)===0?' red':''}
function cardElement(c,onClick,top,selected,down=false){
const el=document.createElement('button');el.type='button';el.className='card'+(c.up?'':' back')+suitClass(c)+(selected?' selected':'');el.style.top=top+'px';
el.setAttribute('aria-label',c.up?lab(c):'Κρυφή κάρτα');el.innerHTML=c.up?'<span class="rank">'+(c.v===1?'A':c.v===11?'J':c.v===12?'Q':c.v===13?'K':c.v)+'</span><span class="suit">'+S[c.s]+'</span><span class="big">'+S[c.s]+'</span>':'';
el.addEventListener('click',e=>{e.stopPropagation();onClick()});if(down)el.style.pointerEvents='none';return el;}
function draw(){
for(const b of document.querySelectorAll('[data-draw]')){
 b.setAttribute('aria-pressed',String(Number(b.dataset.draw)===drawMode));
 b.title='Επιλογή για την επόμενη νέα παρτίδα';
}
for(const info of document.querySelectorAll('.solitaire-deck .info')){
 info.textContent='Τώρα: '+(state.drawCount===3?'3 φύλλα':'1 φύλλο')+' · Επόμενη παρτίδα: '+drawMode+(drawMode===1?' φύλλο':' φύλλα');
}
const foundations=state.f.reduce((sum,pile)=>sum+pile.length,0);
for(const p of document.querySelectorAll('.foundation-count'))p.textContent=foundations+'/52';
for(const p of document.querySelectorAll('.stock-count'))p.textContent=String(state.stock.length);
for(const p of document.querySelectorAll('.foundation-progress'))p.style.width=(foundations/52*100)+'%';
$('modeSummary').textContent='Πασιέντζα Klondike · Τράβηγμα '+(state.drawCount===3?'3 φύλλων':'1 φύλλου');
$('clock').textContent=format(now());$('moves').textContent=String(state.moves);$('wins').textContent=String(stats.wins||0);$('undo').disabled=undo.length===0;
$('draw').classList.toggle('empty',!state.stock.length);$('draw').textContent=state.stock.length?'✦':state.waste.length?'↻':'';
const waste=$('waste');waste.replaceChildren();
const visibleCount=Math.min(state.drawCount===3?3:1,state.waste.length);
waste.setAttribute('aria-label',visibleCount
  ? 'Ανοιγμένες κάρτες: '+visibleCount+' · Τράβηγμα ανά '+state.drawCount+' φύλλα'
  : 'Κενή θέση ανοιγμένων καρτών');
if(visibleCount){
 const recent=state.waste.slice(-visibleCount);
 recent.forEach((c,i)=>{
   const front=i===recent.length-1;
   const card=cardElement(c,()=>{if(front)tapCard('w',0,state.waste.length-1)},0,front&&pick?.zone==='w',!front);
   if(state.drawCount===3){
     card.classList.add('waste-fan');
     card.style.setProperty('--waste-shift',(i-(recent.length-1)/2)*8+'px');
   }
   if(front)card.classList.add('waste-front');
   else{card.tabIndex=-1;card.setAttribute('aria-hidden','true');}
   card.style.zIndex=String(i+1);
   waste.appendChild(card);
 });
}
for(let i=0;i<4;i++){const pile=$('f'+i);pile.replaceChildren();const c=state.f[i].at(-1);if(c)pile.appendChild(cardElement(c,()=>select('f',i),0,pick?.zone==='f'&&pick.col===i));}
const root=$('tableau');root.replaceChildren();
const cw=Math.min(640,root.parentElement.clientWidth-10)/7-5,openStep=Math.max(21,Math.min(31,cw*.44)),downStep=Math.max(10,Math.min(18,cw*.25));
for(let col=0;col<7;col++){
const place=document.createElement('div');place.className='column'+(state.t[col].length?'':' empty');place.dataset.col=col;place.tabIndex=0;place.setAttribute('aria-label','Στήλη '+(col+1));place.addEventListener('click',()=>select('t',col));
place.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select('t',col);}});
let y=0;state.t[col].forEach((c,i)=>{const chosen=pick?.zone==='t'&&pick.col===col&&i>=pick.index;const btn=cardElement(c,()=>tapCard('t',col,i),y,chosen,!c.up);btn.style.zIndex=String(i+1);place.appendChild(btn);y+=c.up?openStep:downStep;});
place.style.minHeight=Math.max(400,y+cw*1.5)+'px';root.appendChild(place);
}
}
function hint(){for(const zone of ['w','t']){for(let col=0;col<(zone==='w'?1:7);col++){const a=zone==='w'?state.waste:state.t[col],i=a.length-1;if(i<0||!a[i].up)continue;const p={zone,col,index:i};if(validMove(p,'f',a[i].s)){say('💡 '+lab(a[i])+' → βάση '+S[a[i].s]);return;}}}
for(let src=0;src<7;src++)for(let i=0;i<state.t[src].length;i++){const p={zone:'t',col:src,index:i};if(!validSequence(pickedCards(p)))continue;for(let dst=0;dst<7;dst++)if(dst!==src&&validMove(p,'t',dst)){say('💡 '+lab(state.t[src][i])+' → στήλη '+(dst+1));return;}}
if(state.stock.length||state.waste.length)say('💡 Τράβηξε κάρτα από την τράπουλα.');else say('Δεν βρέθηκε διαθέσιμη κίνηση.');}
function autoFoundation(){
 if(state.done)return;
 const before=state.f.reduce((n,pile)=>n+pile.length,0);
 snapshot();
 // The explicit Bases button also releases the player's temporary hold.
 state.manualFoundationCards=[];
 const moved=autoToFoundation();
 if(moved){winIfComplete();draw();save();}
 else {undo.pop();draw();save();}
 say(moved?'Μεταφέρθηκαν '+moved+' φύλλα στις βάσεις.':'Δεν υπάρχουν διαθέσιμα φύλλα για τις βάσεις.');
}
function chooseDrawMode(n){
 if(state.done)return;
 if(n!==1&&n!==3)return;
 drawMode=n;
 try{localStorage.setItem(DRAW_SETTING,String(n));}catch(_){}
 draw();
 say('Αποθηκεύτηκε: '+n+(n===1?' φύλλο':' φύλλα')+' στην επόμενη νέα παρτίδα. Η τωρινή δεν αλλάζει.');
}
for(const btn of document.querySelectorAll('[data-draw]')){
 btn.addEventListener('click',()=>chooseDrawMode(Number(btn.dataset.draw)));
}
$('draw').addEventListener('click',drawStock);
$('new').addEventListener('click',async()=>{if(state.moves&& !state.done&&!await GameDialog.confirm('Νέα παρτίδα; Η τωρινή θα χαθεί.'))return;newGame()});
$('newSide').addEventListener('click',()=>$('new').click());
$('undo').addEventListener('click',()=>{const old=undo.pop();if(!old)return;state=old.state;elapsed=old.elapsed;since=active&&!state.done?Date.now():0;pick=null;say('Η τελευταία κίνηση αναιρέθηκε.');draw();save();});
$('hint').addEventListener('click',hint);$('auto').addEventListener('click',autoFoundation);
$('waste').addEventListener('click',()=>select('w',0));for(let i=0;i<4;i++){$('f'+i).addEventListener('click',()=>select('f',i));}
// A timestamp-based second tap works even though cards are recreated after the first tap.
window.addEventListener('resize',()=>draw());
function visibility(){active=document.visibilityState==='visible'&&embeddedActive;if(active)resume();else pause()}
let embeddedActive=true;window.addEventListener('message',e=>{if(e.origin!==location.origin)return;if(e.data?.type==='solitairefunny:visibility'){embeddedActive=!!e.data.active;visibility();}});
document.addEventListener('visibilitychange',visibility);
try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved?.state&&saved.state.t?.length===7&&saved.state.f?.length===4){state=saved.state;state.drawCount=state.drawCount===3?3:1;state.manualFoundationCards=Array.isArray(state.manualFoundationCards)?state.manualFoundationCards:[];elapsed=Number(saved.elapsed)||0;resume();autoToFoundation();say('Η αποθηκευμένη παρτίδα συνεχίζεται.');draw();save();}else newGame();}catch(_){newGame();}
setInterval(()=>{if(since&&active&&!state.done){$('clock').textContent=format(now());if(Math.floor(now()/1000)%8===0)save();}},400);
})();
</script>

<script>
(()=>{

 .funny-help-overlay{
  inset:auto!important;top:0!important;left:100vw!important;right:auto!important;bottom:auto!important;
  width:100dvh!important;height:100vw!important;
  transform-origin:top left!important;transform:rotate(90deg)!important;
  padding:8px!important;box-sizing:border-box!important
 }

  width:min(660px,calc(100% - 6px))!important;

  line-height:1.4!important
 }

`;document.head.append(style);
const overlay=document.createElement('div');overlay.className='funny-help-overlay';overlay.hidden=true;overlay.setAttribute('role','presentation');const card=document.createElement('section');card.className='funny-help-card';card.setAttribute('role','dialog');card.setAttribute('aria-modal','true');card.setAttribute('aria-label','Πώς παίζεται');const title=document.createElement('h2');title.textContent='📖 Πώς παίζεται';const list=document.createElement('ol');for(const rule of rules){const li=document.createElement('li');li.textContent=rule;list.append(li)}const close=document.createElement('button');close.type='button';close.className='funny-help-btn funny-help-close';close.textContent='Επιστροφή στο παιχνίδι';card.append(title,list,close);overlay.append(card);document.body.append(overlay);let previous=null;function hide(){overlay.hidden=true;const target=previous;if(target?.isConnected&&target.getClientRects().length)target.focus();else document.querySelector('#settingsButton,#gear,.funny-help-gear')?.focus()}function show(){previous=document.activeElement;const settings=document.getElementById('settingsDialog');if(settings?.open)settings.close();const chess=document.getElementById('settings');if(chess)chess.hidden=true;overlay.hidden=false;close.focus()}close.addEventListener('click',hide);overlay.addEventListener('click',e=>{if(e.target===overlay)hide()});document.addEventListener('keydown',e=>{if(!overlay.hidden&&e.key==='Escape'){e.stopPropagation();hide()}});
const settings=document.getElementById('settingsDialog')||document.getElementById('settings');const btn=document.createElement('button');btn.type='button';btn.className='funny-help-btn';btn.textContent='📖 Πώς παίζεται';btn.addEventListener('click',show);if(settings){const form=settings.querySelector('form')||settings.querySelector('.dialog')||settings;const last=form.querySelector('button:last-of-type');if(last)last.before(btn);else form.append(btn)}else{const hero=document.querySelector('.hero')||document.querySelector('header')||document.body;hero.classList.add('funny-help-host');const gear=document.createElement('button');gear.type='button';gear.className='funny-help-btn funny-help-gear';gear.textContent='⚙';gear.setAttribute('aria-label','Οδηγίες παιχνιδιού');gear.title='Πώς παίζεται';gear.addEventListener('click',show);hero.append(gear)}
